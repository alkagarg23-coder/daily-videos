name: Daily Auto Video Generator

on:
  schedule:
    # Ye cron roz subah 10:00 AM IST (4:30 AM UTC) chalega
    - cron: '30 4 * * *' 
  workflow_dispatch: # Isse aap GitHub se manually bhi 'Run' button daba sakte hain

jobs:
  generate-and-upload:
    runs-on: self-hosted # Aapke local PC (GPU) par run hone ke liye

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai edge-tts diffusers transformers torch mega.py

      - name: Run Full Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: python pipeline.py
