name: Manual Video Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          set -e

          ollama serve > /tmp/ollama.log 2>&1 &

          echo "Waiting for Ollama..."

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Ollama failed to start."
          echo "========== OLLAMA LOG =========="
          cat /tmp/ollama.log || true
          echo "================================"
          exit 1

      - name: Pull Qwen model
        run: |
          set -e
          ollama pull qwen2.5:3b

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            "tenacity>=8.2.2" \
            pycryptodome \
            requests \
            edge-tts \
            "moviepy==1.0.3" \
            "Pillow<10.0.0" \
            PyYAML

          pip install mega.py --no-deps

      - name: Validate pipeline
        run: |
          set -e

          echo "Checking pipeline.py..."
          python -m py_compile pipeline.py

          echo "Checking required files..."
          test -f pipeline.py
          test -f .github/workflows/manual-video.yml

          echo "Python syntax check passed."
          echo "Required files check passed."

      - name: Run video pipeline
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "🚀 STARTING STICKMAN FINANCE VIDEO ENGINE"
          echo "=========================================="

          python pipeline.py

          echo "=========================================="
          echo "✅ PIPELINE FINISHED"
          echo "=========================================="
