name: Manual Video Generator

on:
  workflow_dispatch: 

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install system dependencies (FFmpeg for video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Ollama & Pull Qwen Model (NO API Needed!)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Ollama server ko background mein start karo
          ollama serve &
          sleep 5
          # Qwen ka 3 Billion parameter wala fast model download karo
          ollama pull qwen2.5:3b

      - name: Install Python dependencies
        # Ab humein google-genai ki zaroorat nahi hai
        run: |
          pip install requests edge-tts mega.py moviepy==1.0.3 "Pillow<10.0.0"

      - name: Run Full Pipeline
        env:
          # Sirf Mega ka email password chahiye, Gemini ki API key ab hata di!
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: python pipeline.py
