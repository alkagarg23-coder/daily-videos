name: Manual Video Generator

on:
  workflow_dispatch: 

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install system dependencies (FFmpeg for video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          # Pehle pycryptodome aur baaki zaroori packages install karenge taaki pycrypto ka error na aaye
          pip install pycryptodome requests tenacity google-genai edge-tts moviepy==1.0.3 "Pillow<10.0.0"
          # Ab mega.py ko bina uske purane dependencies ke install karenge
          pip install mega.py --no-deps

      - name: Run Full Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: python pipeline.py
