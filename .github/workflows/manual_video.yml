name: Manual Video Generator

on:
  workflow_dispatch: # Sirf manual button dabane par chalega

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Fixed: 3.10 deprecation warning gone

      - name: Install system dependencies (FFmpeg for video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        # Fixed: Added Pillow<10.0.0 to prevent MoviePy crashes
        # Fixed: Using new google-genai package
        run: |
          pip install google-genai edge-tts mega.py requests moviepy==1.0.3 "Pillow<10.0.0"

      - name: Run Full Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: python pipeline.py
