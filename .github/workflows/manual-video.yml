name: Ultimate 30-Min Finance Engine (Enterprise)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # ⚡ Caches Python packages too!

      - name: Install Advanced System Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng wget imagemagick

      # ⚡ CACHE 1: KOKORO ONNX MODELS
      - name: Cache Kokoro Models
        id: cache-kokoro
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-v1-models

      - name: Fetch Local TTS Models (If Not Cached)
        if: steps.cache-kokoro.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "Cache miss. Downloading Kokoro models..."
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      # ⚡ CACHE 2: OLLAMA AI MODELS
      - name: Cache Ollama Models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-gemma2-2b-model

      - name: Install Python Software Engine
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install requests "Pillow==9.5.0" kokoro-onnx soundfile

      - name: 🚀 EXECUTE ENTERPRISE PIPELINE (AI + PYTHON)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          
          echo "========================================="
          echo "STARTING LOCAL AI SERVER (OLLAMA)"
          echo "========================================="
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          
          echo "WAITING FOR OLLAMA TO BOOT..."
          sleep 15
          
          # Only pull if model isn't in cache
          echo "PULLING GEMMA2:2B AI SCRIPTWRITER (IF NEEDED)..."
          ollama list | grep "gemma2:2b" || ollama pull gemma2:2b
          
          echo "========================================="
          echo "IGNITING PYTHON ENTERPRISE ENGINE"
          echo "========================================="
          python -u pipeline.py

      - name: Publish Cinematic Release (Video, SEO, Thumbnail)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          COUNT=$(cat counter.txt)
          gh release create "v${COUNT}" \
            output/final_video_${COUNT}.mp4 \
            output/seo_metadata_${COUNT}.txt \
            output/thumbnail_${COUNT}.jpg \
            --title "Cinematic Finance Documentary Episode #${COUNT}" || echo "Release created."

      - name: Database Auto-Sync (Counter)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git commit -m "Auto-update counter [skip ci]" || echo "No changes"
          git push
