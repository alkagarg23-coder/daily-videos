name: Stickman Finance Documentary Studio (Local AI)

on:
  workflow_dispatch:
    inputs:
      test_run:
        description: "TRUE = 1-minute test video; FALSE = full ~30-minute documentary"
        required: true
        type: boolean
        default: true

permissions:
  contents: write


concurrency:
  group: stickman-finance-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Generate video and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TEXT_MODEL_ID: Qwen/Qwen2.5-0.5B-Instruct
      IMAGE_MODEL_ID: stabilityai/sdxl-turbo
      KOKORO_VOICE: am_puck
      TORCH_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: .hf-cache/hub
          key: finance-models-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            finance-models-${{ runner.os }}-

      - name: Restore pipeline checkpoint and intermediate assets
        uses: actions/cache/restore@v4
        with:
          path: studio_work
          key: finance-work-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            finance-work-${{ runner.os }}-${{ github.ref_name }}-

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg espeak-ng libsndfile1 fontconfig fonts-dejavu-core curl ca-certificates
          sudo mkdir -p /usr/share/fonts/truetype/custom
          if curl --retry 3 --retry-delay 2 -fsSL \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton%5Bwght%5D.ttf' \
            -o /tmp/Anton-Regular.ttf; then
            sudo install -m 0644 /tmp/Anton-Regular.ttf /usr/share/fonts/truetype/custom/Anton-Regular.ttf
          else
            echo 'Anton font download unavailable; DejaVu Sans Bold remains installed as fallback.'
          fi
          sudo fc-cache -f
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/stickman-finance.yml

      - name: Install CPU PyTorch and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "kokoro>=0.9.4" \
            "misaki[en]>=0.9.4" \
            "diffusers>=0.35.0" \
            "transformers>=4.45.0" \
            "accelerate>=0.30.0" \
            "safetensors>=0.4.5" \
            "huggingface_hub>=0.26.0" \
            "pillow>=10.0.0" \
            "soundfile>=0.12.1" \
            "numpy>=1.26.0,<3" \
            "requests>=2.31.0" \
            sentencepiece
          python - <<'PY'
          import torch, PIL, soundfile, numpy
          print('PyTorch:', torch.__version__, 'CUDA available:', torch.cuda.is_available())
          print('Pillow:', PIL.__version__, 'NumPy:', numpy.__version__, 'SoundFile:', soundfile.__version__)
          PY

      - name: Confirm local-only model configuration
        run: |
          echo "Text model: $TEXT_MODEL_ID (downloaded weights, local inference)"
          echo "Image model: $IMAGE_MODEL_ID (Diffusers local inference)"
          echo "TTS: Kokoro voice $KOKORO_VOICE (local inference)"
          echo "No paid AI API keys are configured."

      - name: Generate the documentary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.test_run }}" == "true" ]]; then
            echo 'Starting 1-minute TEST run (12 still images, 5 seconds each).'
            python pipeline.py --test-run
          else
            echo 'Starting full ~30-minute documentary run (360 still images, 5 seconds each).'
            python pipeline.py
          fi

      - name: Publish assets to a GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: stickman-finance-${{ github.run_id }}-${{ github.run_attempt }}
          name: ${{ steps.build.outputs.release_name }}
          body_path: output/release_notes.md
          files: |
            output/final_documentary.mp4
            output/thumbnail.png
            output/youtube_seo.txt
            output/release_notes.md
          draft: false
          prerelease: ${{ inputs.test_run }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean temporary assets after successful release
        if: success()
        run: python pipeline.py --mark-published

      - name: Preserve local model cache for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hf-cache/hub
          key: finance-models-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve checkpoint for resume after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: studio_work
          key: finance-work-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failure checkpoint for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stickman-studio-checkpoint-${{ github.run_id }}
          path: |
            studio_work/checkpoint.json
            studio_work/script.json
            studio_work/sentence_timings.json
          if-no-files-found: ignore
          retention-days: 14
