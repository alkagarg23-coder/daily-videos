name: Ultimate 30-Min Local Finance Engine

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub Action ki max limit

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Tools & FFmpeg
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu espeak-ng wget build-essential cmake
          
      - name: Build Local SD Engine & Fetch Dreamshaper v8
        run: |
          set -e
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp
          cd stable-diffusion.cpp
          mkdir build && cd build
          
          cmake .. 
          cmake --build . --config Release
          
          # FIXED: Properly locating and copying the built binary
          SD_BINARY=$(find . -name "sd" -type f -executable | head -n 1)
          if [ -z "$SD_BINARY" ]; then
            # Fallback path if find fails
            cp bin/sd ../../sd
          else
            cp "$SD_BINARY" ../../sd
          fi
          
          cd ../../
          chmod +x sd
          
          wget -q https://huggingface.co/Lykon/DreamShaper/resolve/main/DreamShaper_8_pruned.safetensors -O model.safetensors

      - name: Fetch Local TTS Models (Kokoro)
        run: |
          set -e
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Install Python Libraries
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install requests "Pillow==10.0.0" kokoro-onnx soundfile

      - name: 🚀 EXECUTE 100% LOCAL PIPELINE
        run: |
          set -e
          
          echo "STARTING LOCAL AI SERVER (OLLAMA)"
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 15
          ollama pull gemma2:2b
          
          echo "IGNITING PYTHON ENTERPRISE ENGINE"
          python -u pipeline.py

      - name: Publish Standalone Cinematic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")
          gh release create "v${RELEASE_TAG}" \
            output/final_video.mp4 \
            output/seo_metadata.txt \
            output/thumbnail.jpg \
            --title "Finance Masterclass (${RELEASE_TAG})" || echo "Release created."
