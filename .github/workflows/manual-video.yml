name: 30-Min Masterclass Production (Zero-Error Engine)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies & FFmpeg
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core wget tar
          ffmpeg -version

      - name: Setup Piper TTS (Local Neural Voice)
        run: |
          set -e
          wget -q https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz
          tar -xzf piper_amd64.tar.gz
          mkdir -p models
          wget -q -O models/voice.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/bryce/medium/en_US-bryce-medium.onnx
          wget -q -O models/voice.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/bryce/medium/en_US-bryce-medium.onnx.json

      - name: Setup Ollama (Local AI Scriptwriter)
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10
          ollama pull qwen2.5:3b

      - name: Install Python Libraries
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install requests "moviepy==1.0.3" Pillow

      - name: Execute Core Video Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          python pipeline.py

      - name: Publish Final Video to Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          COUNT=$(cat counter.txt)
          gh release create "v${COUNT}" \
            output/final_video_${COUNT}.mp4 \
            --title "Pro Finance Masterclass Episode #${COUNT}" || echo "Release created."

      - name: Auto-Update Episode Counter
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git commit -m "Auto-update counter [skip ci]" || echo "No changes"
          git push
