name: 30-Min Masterclass Production (Zero-RAM Crash)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (FFmpeg & Espeak)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng wget
          ffmpeg -version

      - name: Download Kokoro ONNX Model
        run: |
          set -e
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Setup Ollama (Llama 3.2 for Long Scripts)
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10
          ollama pull llama3.2

      - name: Install Python Libraries
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install requests "Pillow==9.5.0" kokoro-onnx soundfile

      - name: Execute Core Video Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          python pipeline.py

      - name: Publish Final Video to Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          COUNT=$(cat counter.txt)
          gh release create "v${COUNT}" \
            output/final_video_${COUNT}.mp4 \
            --title "Pro Finance Masterclass Episode #${COUNT}" || echo "Release created."

      - name: Auto-Update Episode Counter
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git commit -m "Auto-update counter [skip ci]" || echo "No changes"
          git push
